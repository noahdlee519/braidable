<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>braidable.ai · site under construction</title>
<meta name="description" content="braidable.ai is under construction. Check back soon.">
<link rel="canonical" href="https://braidable.ai/">
<meta property="og:title" content="braidable.ai">
<meta property="og:description" content="Site under construction.">
<meta property="og:url" content="https://braidable.ai/">
<meta property="og:image" content="https://braidable.ai/icon-512.png?v=2">
<meta name="theme-color" content="#2a44d6">
<link rel="icon" href="favicon.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preload" href="fonts/sora-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/sora-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Sora";
  font-weight: 400;
  font-display: block;
  src: url("fonts/sora-400.woff2") format("woff2");
}
@font-face {
  font-family: "Sora";
  font-weight: 700;
  font-display: block;
  src: url("fonts/sora-700.woff2") format("woff2");
}
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
}
#art {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}
/* Shown only if the script can't run; otherwise kept for screen readers. */
.fallback {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 8px;
  color: #ffffff;
  font-family: "Sora", "Helvetica Neue", Helvetica, Arial, sans-serif;
  text-align: center;
}
.fallback h1 { margin: 0; font-size: 48px; font-weight: 700; }
.fallback p { margin: 0; font-size: 20px; }
/* The pattern sweeps in from the bottom-left corner to the top-right.
   Each piece is an arm running left or down from a 45° seam; the arms appear in turn, left then down,
   so the pattern builds up like a braid being woven. */
.sweep .arm { animation: 480ms cubic-bezier(.2, .7, .2, 1) both; animation-delay: var(--delay, 0ms); }
.sweep .left { animation-name: arm-left; }
.sweep .down { animation-name: arm-down; }
@keyframes arm-left { from { opacity: 0; transform: translate(var(--lx), var(--ly)); } }
@keyframes arm-down { from { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
/* Then the words pop in: a quick scale up with a slight overshoot. */
.sweep .pop { transform-box: fill-box; transform-origin: center; animation: pop 520ms cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: var(--delay, 0ms); }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } 60% { opacity: 1; } }
/* The stripes inside the logo's pill keep flowing toward the top-right, one repeat at a time. */
.pill-flow { animation: pill-flow 1.1s linear infinite; }
@keyframes pill-flow { from { transform: translateX(calc(-1 * var(--tw))); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .sweep .arm, .sweep .pop, .pill-flow { animation: none; } }
.js .fallback {
  width: 1px; height: 1px; inset: auto; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
</style>
</head>
<body>
<div class="fallback">
  <h1>braidable.ai</h1>
  <p>site under construction</p>
</div>
<svg id="art" aria-hidden="true"></svg>
<script>
document.documentElement.classList.add('js');
(() => {
  const BLUE = '#2a44d6', WHITE = '#ffffff';
  const BRAND = 'braıdable.ai';  // dotless ı under the pill, as in the logo
  const STATUS = 'site under construction';
  const MARGIN = 20;
  const SWEEP_MS = 2400;   // time for the sweep to cross the screen
  const svg = document.getElementById('art');
  const NS = 'http://www.w3.org/2000/svg';
  const ctx = document.createElement('canvas').getContext('2d');
  let first = true;

  const el = (name, attrs, parent) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const f = (v) => +v.toFixed(2);
  const poly = (list) => 'M' + list.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z';

  // Measurements in Sora at 100px. Widths and letter positions come from the SVG text itself
  // (what will actually be drawn); ink overhangs come from the canvas.
  function metrics() {
    const probe = (weight, text) => {
      const t = el('text', { 'font-family': 'Sora', 'font-weight': weight, 'font-size': 100, x: 0, y: 0 }, svg);
      t.textContent = text;
      return t;
    };
    const tb = probe(700, BRAND);
    const width = tb.getComputedTextLength();
    const aStart = tb.getStartPositionOfChar(2).x, iStart = tb.getStartPositionOfChar(3).x;
    const ts = probe(400, STATUS);
    const statusW = ts.getComputedTextLength();
    tb.remove(); ts.remove();

    ctx.font = '700 100px Sora';
    const m = (t) => ctx.measureText(t);
    const asc = m('b').actualBoundingBoxAscent, xh = m('a').actualBoundingBoxAscent;
    const aLeft = aStart - m('a').actualBoundingBoxLeft;
    const iRight = iStart + m('\u0131').actualBoundingBoxRight;
    const lastRight = width - m('i').width + m('i').actualBoundingBoxRight;
    // The pill sits over "aı" just as in the logo: a quarter of the ascender tall, a sliver above the x-height.
    const pillH = 0.26 * asc, pillBottom = xh + 0.045 * asc;
    ctx.font = '400 100px Sora';
    return {
      width: Math.max(width, lastRight),
      pill: { left: aLeft + 0.07 * asc, right: iRight, bottom: pillBottom, top: pillBottom + pillH },
      inkTop: Math.max(asc, pillBottom + pillH),
      statusW, statusCap: ctx.measureText('d').actualBoundingBoxAscent,
    };
  }

  // Everything is laid out on a sheet turned 45°: bands run left to right on the sheet,
  // which is up and to the right on screen. Proportions measured from the mock-up.
  function build(P, vw, vh, m) {
    const g = { P };
    g.T = 0.16 * P;            // white line between bands
    g.W = P - g.T;             // band
    g.A = 0.575 * P;           // repeat along the band
    g.a = 0.40 * P;            // blue part of each repeat
    g.s = g.A - g.a;           // the lower row sits one gap to the right of the upper row
    g.h = g.W / 2;
    g.dx = g.h;                // 45°: on screen the arms run exactly horizontal and vertical

    // braidable.ai on a white rectangle over band 0.
    g.k = (0.8 * g.W) / m.inkTop;
    g.fs = 100 * g.k;
    const textW = m.width * g.k, pad = 0.18 * g.W;
    g.textX = 0;
    g.baseline = g.h + (m.inkTop * g.k) / 2;
    g.brandRect = { x: -pad, y: 0, w: textW + 2 * pad, h: g.W };

    // site under construction: on the band straight below, reading the same way as braidable.ai.
    // Its blue strip starts at the same left edge and takes over only the leftmost sections of that band:
    // the right end follows the outline of a pattern section, so it merges with it instead of slicing one.
    const brandW = textW + 2 * pad;
    g.fs2 = Math.max(12, Math.min(0.22 * P, (0.5 * brandW - 2 * pad) * 100 / m.statusW));
    const len = m.statusW * g.fs2 / 100, cap = m.statusCap * g.fs2 / 100;
    // The strip is half the band's height (its upper row only). Its right end lines up with the
    // bottom-right corner of the braidable.ai box; its left end follows the outline of a pattern piece.
    const R = textW + pad, y = P;
    const i = Math.floor((R - len - 2 * pad - g.dx / 2) / g.A);
    const xi = i * g.A;
    g.strip = [[xi, y], [R, y], [R, y + g.h], [xi + g.dx, y + g.h]];
    g.statusX = (xi + g.dx / 2 + R) / 2 - len / 2;
    g.statusY = y + g.h / 2 + cap / 2;

    // Centre both rectangles on screen.
    const r1 = g.brandRect;
    const corners = [[r1.x, r1.y], [r1.x + r1.w, r1.y], [r1.x, r1.y + r1.h], [r1.x + r1.w, r1.y + r1.h]].concat(g.strip);
    // Centre the bounding box as it appears on screen (after the 45° turn), then map that point back to the sheet.
    const c = Math.SQRT1_2;
    const us = corners.map(([x, y]) => (x + y) * c), vs = corners.map(([x, y]) => (y - x) * c);
    const mu = (Math.min(...us) + Math.max(...us)) / 2, mv = (Math.min(...vs) + Math.max(...vs)) / 2;
    g.cx = (mu - mv) * c;
    g.cy = (mu + mv) * c;
    const sp = corners.map(([x, y]) => [vw / 2 + ((x - g.cx) + (y - g.cy)) * c, vh / 2 + (-(x - g.cx) + (y - g.cy)) * c]);
    const sx = sp.map((p) => p[0]), sy = sp.map((p) => p[1]);
    g.overflow = Math.max(MARGIN - Math.min(...sx), Math.max(...sx) - (vw - MARGIN), MARGIN - Math.min(...sy), Math.max(...sy) - (vh - MARGIN));
    g.span = [Math.max(...sx) - Math.min(...sx), Math.max(...sy) - Math.min(...sy)];
    return g;
  }

  function draw() {
    const vw = innerWidth, vh = innerHeight;
    svg.textContent = '';
    const m = metrics();
    let P = Math.max(52, Math.min(130, vw * 0.21, vh * 0.13));
    let g = build(P, vw, vh, m);
    for (let i = 0; i < 6 && g.overflow > 0 && P > 24; i++) {
      P = Math.max(24, P * Math.min((vw - 2 * MARGIN) / g.span[0], (vh - 2 * MARGIN) / g.span[1], 0.97));
      g = build(P, vw, vh, m);
    }
    const motion = first && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    first = false;

    svg.textContent = '';
    svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    svg.classList.toggle('sweep', motion);
    // Each arm slides in a short way along its own direction: the left arms from the left, the down
    // arms from below. On the turned sheet, screen-left is (-1,-1)/√2 and screen-down is (-1,1)/√2.
    const nudge = 0.22 * P * Math.SQRT1_2;
    svg.style.setProperty('--lx', f(-nudge) + 'px'); svg.style.setProperty('--ly', f(-nudge) + 'px');
    svg.style.setProperty('--dx', f(-nudge) + 'px'); svg.style.setProperty('--dy', f(nudge) + 'px');
    const defs = el('defs', {}, svg);
    const sheet = el('g', { transform: `translate(${vw / 2} ${vh / 2}) rotate(-45) translate(${f(-g.cx)} ${f(-g.cy)})` }, svg);

    // The pattern: for each column, one path of upper-row pieces (arms running left on screen) and one
    // of lower-row pieces (arms running down). Delays follow the band direction, which on screen runs
    // from the bottom-left corner to the top-right; within a column the left arm comes first, then the down arm.
    const D = Math.hypot(vw, vh) / 2 + P;
    const k0 = Math.floor((g.cy - D) / P), k1 = Math.ceil((g.cy + D) / P);
    const i0 = Math.floor((g.cx - D) / g.A) - 2, i1 = Math.ceil((g.cx + D) / g.A);
    const reach = Math.SQRT1_2 * (vw + vh) / 2;          // how far the screen's corners lie along the band direction
    const xFirst = g.cx - reach - g.A * 2, xLast = g.cx + reach;
    const step = SWEEP_MS / ((xLast - xFirst) / g.A);     // time from one column to the next
    for (let i = i0; i <= i1; i++) {
      const x = i * g.A;
      let up = '', down = '';
      for (let k = k0; k <= k1; k++) {
        const y = k * P;
        up += poly([[x, y], [x + g.a, y], [x + g.a + g.dx, y + g.h], [x + g.dx, y + g.h]]);
        // The down arm reaches a hair past the seam so the two arms meet without a visible line.
        const o = 0.8, ox = o * g.dx / g.h;
        down += poly([[x + g.s + g.dx + ox, y + g.h - o], [x + g.s + g.dx + g.a + ox, y + g.h - o], [x + g.s + g.a, y + g.W], [x + g.s, y + g.W]]);
      }
      const t = Math.max(0, ((x - xFirst) / g.A) * step);
      const left = el('path', { d: up, fill: BLUE, class: 'arm left' }, sheet);
      const dn = el('path', { d: down, fill: BLUE, class: 'arm down' }, sheet);
      if (motion) {
        left.style.setProperty('--delay', Math.round(t) + 'ms');
        dn.style.setProperty('--delay', Math.round(t + step / 2) + 'ms');
      }
    }

    // The words sit on top of the pattern and pop in once it has finished: braidable.ai on its white
    // box, then the logo's pill, then site under construction on its blue strip.
    const popAt = 0.7 * SWEEP_MS + 250;   // as the sweep's last columns settle
    const group = (delay) => {
      const grp = el('g', { class: 'pop' }, sheet);
      if (motion) grp.style.setProperty('--delay', Math.round(popAt + delay) + 'ms');
      return grp;
    };
    const b = g.brandRect, st = g.strip;
    const brandG = group(0), pillG = group(220), statusG = group(380);

    // A hairline stroke in the same colour hides the anti-aliased edges of the pattern underneath.
    el('rect', { x: f(b.x), y: f(b.y), width: f(b.w), height: f(b.h), fill: WHITE, stroke: WHITE, 'stroke-width': 1.5 }, brandG);
    const brand = el('text', { x: g.textX, y: f(g.baseline), fill: BLUE, 'font-family': 'Sora', 'font-weight': 700, 'font-size': f(g.fs) }, brandG);
    brand.textContent = BRAND;

    // The logo's pill over "aı": blue, with white chevrons inside a blue ring.
    const p = m.pill, k = g.k;
    const px = g.textX + p.left * k, pw = (p.right - p.left) * k;
    const ph = (p.top - p.bottom) * k, py = g.baseline - p.top * k;
    // Measured from the logo: white bars 15 wide on a 48 repeat, 60 tall inside the ring. The lower row
    // sits one bar-width to the right of the upper row, with a thin blue line between the two rows.
    // The stripes slide continuously along the pill (up and to the right on screen), clipped by its ring.
    const ring = ph * 0.075, ih = ph - 2 * ring, tw = ih * 48 / 60, sc = ih / 60;
    const ix = px + ring, iy = py + ring, iw = pw - 2 * ring;
    const clip = el('clipPath', { id: 'pill-clip' }, defs);
    el('rect', { x: f(ix), y: f(iy), width: f(iw), height: f(ih), rx: f(ih / 2) }, clip);
    el('rect', { x: f(px), y: f(py), width: f(pw), height: f(ph), rx: f(ph / 2), fill: BLUE }, pillG);
    const inner = el('g', { 'clip-path': 'url(#pill-clip)' }, pillG);
    const bars = [[[0, 0], [15, 0], [39.5, 28], [24.5, 28]], [[40.7, 32], [55.7, 32], [30, 60], [16, 60]], [[-7.3, 32], [7.7, 32], [-18, 60], [-32, 60]]];
    let sd = '';
    for (let n = -2; n * tw < iw + tw; n++) {
      const x0 = ix + tw * 0.3 + n * tw;
      for (const bar of bars) sd += poly(bar.map(([bx, by]) => [x0 + bx * sc, iy + by * sc]));
    }
    const flow = el('path', { d: sd, fill: WHITE, class: 'pill-flow' }, inner);
    flow.style.setProperty('--tw', f(tw) + 'px');

    // site under construction
    el('path', { d: poly(st), fill: BLUE, stroke: BLUE, 'stroke-width': 1 }, statusG);
    const status = el('text', { x: f(g.statusX), y: f(g.statusY), fill: WHITE, 'font-family': 'Sora', 'font-weight': 400, 'font-size': f(g.fs2) }, statusG);
    status.textContent = STATUS;
  }

  let timer;
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(draw, 100); });
  Promise.all([document.fonts.load('700 100px Sora'), document.fonts.load('400 20px Sora')]).then(draw, draw);
})();
</script>
</body>
</html>
